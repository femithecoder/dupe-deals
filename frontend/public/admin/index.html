<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Belt and braces with the Disallow in app/robots.ts: this page is a
         login wall, and a search result pointing at it helps nobody. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>DupeDeals content</title>
  </head>
  <body>
    <!-- Sveltia CMS rather than Decap. It reads the same config.yml, so
         switching back is a one-line change, but it is far better on a phone
         and noticeably faster on a repo this size. Pinned to an exact version
         on purpose: this is loaded from a CDN at runtime, and an unpinned tag
         means a stranger's release can change the editor under you without a
         deploy on our side. -->
    <script src="https://unpkg.com/@sveltia/cms@0.208.2/dist/sveltia-cms.js" type="module"></script>

    <!-- Our own house rules, live beside the text: em dashes, prices typed as
         literals instead of tokens, malformed price tokens, organisations used
         without introduction, product sections with no image, and the edit
         damage that has actually shipped before now. Grammar and spelling are
         not its job; Grammarly or the browser's spellcheck cover those. -->
    <script src="/admin/checks.js" defer></script>
  </body>
</html>
