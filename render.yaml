# Render Blueprint for the two backend services plus a free Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo. Render
# reads this file automatically.
#
# After the blueprint deploys, two manual steps in the Render dashboard:
#   1. dupedeals-product-service -> Environment -> set AWIN_API_KEY (from Awin
#      dashboard -> My Account -> API Credentials) and CRON_SECRET (any random
#      string, used to authenticate POST /admin/price-check if you ever trigger
#      it from an external scheduler instead of the built-in daily cron, also
#      required by .github/workflows/daily-price-check.yml, which needs the
#      same value saved as a GitHub Actions repo secret named CRON_SECRET).
#      DATABASE_URL is wired automatically from the dupedeals-db database below.
#      Also set FRONTEND_REVALIDATE_URL (e.g. https://www.dupedeals.co.uk/api/revalidate)
#      and REVALIDATE_SECRET (any random string) so a real price change pokes
#      the frontend to drop its cached product data immediately, see
#      frontend/app/api/revalidate/route.ts. REVALIDATE_SECRET must match the
#      same-named env var set on the Vercel project. Both are optional, if
#      unset the price check just skips notifying the frontend.
#   2. dupedeals-gateway -> Environment -> set PRODUCT_SERVICE_URL to
#      dupedeals-product-service's onrender.com URL, visible on its dashboard
#      page once deployed.
#
# Then on Vercel: set NEXT_PUBLIC_GATEWAY_URL to dupedeals-gateway's
# onrender.com URL and redeploy the frontend. Do NOT point it at
# product-service directly, the gateway is what adds the /api prefix the
# frontend expects (frontend/lib/api.ts calls /api/products/..., the gateway
# strips /api and forwards to product-service's /products/...). Also set
# REVALIDATE_SECRET on Vercel to match product-service's value above.
#
# After first deploy, run `npm run seed` once via product-service's Shell tab
# to populate the fresh database.
#
# Plans: Render re-applies this blueprint on pushes to the linked branch, not
# only when this file changes, so a `plan:` here overrides whatever the
# dashboard says and can downgrade a running resource.
#
# dupedeals-product-service (paid, $7/mo) and dupedeals-db (paid) therefore
# have NO `plan:` line. Per Render's blueprint spec, an omitted plan means
# "Render retains the current compute plan for an existing service", so the
# dashboard stays authoritative for the two resources that cost money and no
# sync can reset them. Do not add a plan back to either without checking the
# dashboard first, and note the current tokens are sizes like `0.5c-512mb`,
# not the older tier names.
#
# dupedeals-gateway keeps `plan: free` deliberately, because it really is on
# free, and because a NEW service with no plan defaults to a paid instance.
# That line is what stops a fresh deploy of this blueprint quietly billing.
#
# Spin-down only applies to a service still on free, i.e. the gateway (~15 min
# of no HTTP traffic). The scheduler in
# services/product-service/pricing/scheduler.js survives it either way, see the
# comment there.
#
# The database is billed separately from the web services. It holds the only
# unrecoverable data (price_history), so back it up with
# `npm run backup` in services/product-service before any plan change.

databases:
  - name: dupedeals-db
    databaseName: dupedeals
    user: dupedeals
    # plan omitted on purpose, see the note above: it is paid, and Render
    # keeps an existing database's current plan when this is absent.

services:
  - type: web
    name: dupedeals-gateway
    runtime: node
    rootDir: gateway
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PRODUCT_SERVICE_URL
        sync: false

  - type: web
    name: dupedeals-product-service
    runtime: node
    rootDir: services/product-service
    # plan omitted on purpose, see the note above: this is the $7/mo paid
    # service, and Render keeps its current plan when this is absent.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dupedeals-db
          property: connectionString
      - key: PRICE_PROVIDER
        value: awin
      - key: PRICE_CHECK_CRON
        value: "0 6 * * *"
      - key: AWIN_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
