name: Amazon price check

# Amazon's prices change several times a day (their own dynamic pricing),
# but Awin's product feed for Amazon is a periodic snapshot, not real-time,
# so it lags behind Amazon's live buy-box price by however long since Awin
# last refreshed. Confirmed by spot-checking 5 Amazon products against their
# live Amazon page: 2 were already off (one too high, one too low) despite
# the daily check having run less than a day earlier. Not a bug in our
# matching/parsing, real upstream feed lag. Running the check more often for
# Amazon specifically shrinks that average lag window; it doesn't eliminate
# it (still bounded by how often Awin itself refreshes), and other merchants
# (Quzo) haven't shown this problem, so they stay on the once-daily schedule
# in daily-price-check.yml rather than adding load for no benefit.

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

jobs:
  price-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Amazon price check
        run: |
          response=$(curl -sf --max-time 120 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://dupedeals-product-service.onrender.com/admin/price-check?merchant=Amazon")
          echo "$response"
          failure_count=$(echo "$response" | jq '.failures | length')
          if [ "$failure_count" -gt 0 ]; then
            echo "::error::$failure_count product(s) failed to price-check, see the failures array above"
            exit 1
          fi
