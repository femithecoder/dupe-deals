name: Keep Render backend awake

# This started as a way to stop Render's free tier spinning down after ~15 min
# of no traffic (a cold request could time out and drop the site back to static
# mock data). At least one service is on a paid plan now and no longer sleeps,
# so the ping's main job today is the alert below: it is the only thing that
# tells us the backend is down, since nothing else watches these endpoints.
#
# The 10-minute cadence is inherited from the anti-sleep days and is more often
# than an uptime check needs. It's kept because it also buys a faster outage
# signal, and still prevents spin-down for any resource left on free. Dropping
# to hourly is safe if the Actions minutes are better spent elsewhere.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# A single ping failing the job (and emailing the repo owner via GitHub's
# built-in failed-workflow notification, Settings -> Notifications -> Actions)
# used to be swallowed with "will retry next run", so a real outage produced
# no signal at all until someone happened to check the site. --retry absorbs
# a single transient blip; if it still fails after that, it's real and should
# alert. This is deliberately noisy for the duration of a real outage (fires
# again every ~10 min until it recovers), that's the point, not a bug.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping gateway
        run: curl -sf --retry 3 --retry-delay 5 --max-time 60 https://dupedeals-gateway.onrender.com/health
      - name: Ping product-service
        run: curl -sf --retry 3 --retry-delay 5 --max-time 60 https://dupedeals-product-service.onrender.com/health
