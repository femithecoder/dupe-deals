name: Daily price check

# Belt-and-braces alongside the in-process node-cron in
# services/product-service/pricing/scheduler.js. That scheduler only fires if
# the Render service happens to be awake at exactly 06:00 server time, and
# node-cron does not catch up on a missed fire, if Render was asleep at that
# instant, the whole day's check is silently lost. Confirmed via
# price_history that this has actually happened repeatedly. Triggering the
# check externally via HTTP sidesteps that: the request itself wakes the
# service (same as keep-alive.yml), and running it a few minutes late is
# harmless. Running both is safe, /admin/price-check is idempotent to call
# twice in the same window.

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

jobs:
  price-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger price check
        run: |
          # -f already fails (and emails, via GitHub's built-in failed-workflow
          # notification) on a non-2xx, which alone would have caught today's
          # OOM crash (it returned 502). But a run can also come back 200 with
          # individual merchants failed inside the body (e.g. one feed 404s),
          # that's not an HTTP failure so -f alone won't catch it, check the
          # response itself too.
          response=$(curl -sf --max-time 120 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://dupedeals-product-service.onrender.com/admin/price-check)
          echo "$response"
          failure_count=$(echo "$response" | jq '.failures | length')
          if [ "$failure_count" -gt 0 ]; then
            echo "::error::$failure_count product(s) failed to price-check, see the failures array above"
            exit 1
          fi
