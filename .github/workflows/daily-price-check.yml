name: Daily price check

# Belt-and-braces backup alongside the in-process catch-up scheduler in
# services/product-service/pricing/scheduler.js. That scheduler is the primary
# driver (it re-checks whenever the full catalog is more than its max-age old),
# but it only runs while the Render service is awake. Triggering the check
# externally via HTTP is a safety net: the request itself wakes the service
# (same as keep-alive.yml), so a full-catalog check still lands even if the
# process happened to be asleep through the scheduler's own evaluations.
# Running both is safe, /admin/price-check is idempotent to call twice in the
# same window. Twice daily (06:05 and 18:05), kept in step with the scheduler's
# 12h full-catalog max-age.

on:
  schedule:
    - cron: "5 6,18 * * *"
  workflow_dispatch:

jobs:
  price-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger price check
        run: |
          # -f already fails (and emails, via GitHub's built-in failed-workflow
          # notification) on a non-2xx, which alone would have caught today's
          # OOM crash (it returned 502). But a run can also come back 200 with
          # individual merchants failed inside the body (e.g. one feed 404s),
          # that's not an HTTP failure so -f alone won't catch it, check the
          # response itself too.
          response=$(curl -sf --max-time 120 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://dupedeals-product-service.onrender.com/admin/price-check)
          echo "$response"
          failure_count=$(echo "$response" | jq '.failures | length')
          if [ "$failure_count" -gt 0 ]; then
            echo "::error::$failure_count product(s) failed to price-check, see the failures array above"
            exit 1
          fi
